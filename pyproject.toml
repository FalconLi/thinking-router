[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thinking-router"
version = "0.1.0"
description = "Learning When to Reason: Lightweight Routing for a Small Language Model"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.7.1", "transformers==4.57.6", "huggingface-hub==0.36.2",
    "numpy==2.5.4", "pandas==2.3.3", "scikit-learn==1.7.2", "scipy==1.18.1",
    "PyYAML==6.0.3", "joblib==1.6.0", "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
include = ["routing_project*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
